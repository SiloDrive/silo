<!doctype html>
<meta charset="utf-8">
<title>Silo brand assets</title>
<style>
  body { margin:0; padding:40px; background:#f3f2f2; color:#201e1d;
         font:15px/1.5 "Archivo",system-ui,sans-serif; }
  h1 { font-size:34px; margin:0 0 4px; letter-spacing:-0.02em; }
  h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#ec3013;
       margin:36px 0 14px; border-bottom:2px solid rgba(32,30,29,.4); padding-bottom:8px; }
  .row { display:flex; flex-wrap:wrap; gap:26px; align-items:flex-end; }
  figure { margin:0; display:flex; flex-direction:column; gap:7px; align-items:flex-start; }
  figcaption { font-size:10px; color:#605d5d; font-family:ui-monospace,monospace; }
  .dark { background:#201e1d; padding:14px; }
  .chip { width:16px; height:16px; }
</style>
<h1>Silo brand assets</h1>
<div style="color:#605d5d">Platters geometry · red #ec3013 · orange #f5821f · ink #201e1d</div>

<h2>Mark — 64</h2>
<div class="row">
  <figure><img src="silo-mark-red.svg" width="96"><figcaption>silo-mark-red</figcaption></figure>
  <figure><img src="silo-mark-orange.svg" width="96"><figcaption>silo-mark-orange</figcaption></figure>
  <figure><img src="silo-mark-ink.svg" width="96"><figcaption>silo-mark-ink</figcaption></figure>
  <figure><div class="dark"><img src="silo-mark-white.svg" width="96"></div><figcaption>silo-mark-white</figcaption></figure>
  <figure><div class="dark"><img src="silo-mark-knockout-red.svg" width="96"></div><figcaption>knockout-red</figcaption></figure>
  <figure><div class="dark"><img src="silo-mark-knockout-orange.svg" width="96"></div><figcaption>knockout-orange</figcaption></figure>
</div>

<h2>App icon</h2>
<div class="row">
  <figure><img src="silo-app-icon-red.svg" width="104"><figcaption>red</figcaption></figure>
  <figure><img src="silo-app-icon-red-inverse.svg" width="104"><figcaption>red-inverse</figcaption></figure>
  <figure><img src="silo-app-icon-orange.svg" width="104"><figcaption>orange</figcaption></figure>
  <figure><img src="silo-app-icon-orange-inverse.svg" width="104"><figcaption>orange-inverse</figcaption></figure>
  <figure><img src="silo-app-icon-ink.svg" width="104"><figcaption>ink</figcaption></figure>
</div>

<h2>Small sizes — 32 &amp; 16, actual size then 4×</h2>
<div class="row">
  <figure><img src="silo-32-red.svg" width="32"><figcaption>32-red</figcaption></figure>
  <figure><img src="silo-32-red.svg" width="128"><figcaption>32-red 4×</figcaption></figure>
  <figure><img src="silo-32-orange.svg" width="128"><figcaption>32-orange 4×</figcaption></figure>
  <figure><img src="silo-16-red.svg" width="16"><figcaption>16-red</figcaption></figure>
  <figure><img src="silo-16-red.svg" width="64"><figcaption>16-red 4×</figcaption></figure>
  <figure><img src="silo-16-orange.svg" width="64"><figcaption>16-orange 4×</figcaption></figure>
</div>

<h2>Sidebar glyph — 5a solid</h2>
<div class="row">
  <figure><div class="dark"><img src="silo-sidebar-16.svg" width="17" style="filter:invert(1)"></div><figcaption>sidebar-16 @1×</figcaption></figure>
  <figure><img src="silo-sidebar-16.svg" width="68"><figcaption>sidebar-16 4×</figcaption></figure>
  <figure><img src="silo-sidebar-16-red.svg" width="68"><figcaption>sidebar-16-red</figcaption></figure>
  <figure><img src="silo-sidebar-16-orange.svg" width="68"><figcaption>sidebar-16-orange</figcaption></figure>
</div>

<h2>SiloDrive</h2>
<div class="row">
  <figure><img src="silodrive-red.svg" width="96"><figcaption>silodrive-red</figcaption></figure>
  <figure><img src="silodrive-orange.svg" width="96"><figcaption>silodrive-orange</figcaption></figure>
  <figure><div class="dark"><img src="silodrive-white.svg" width="96"></div><figcaption>silodrive-white</figcaption></figure>
</div>
