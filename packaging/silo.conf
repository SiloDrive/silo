# /etc/silo/silo.conf
#
# Silo needs no config file. Everything below is commented out and shows the
# compiled-in default; a deployment that leaves this file untouched gets those
# defaults, which is the expected case.
#
# Precedence: command-line flags > environment variables > this file > the
# compiled defaults. So anything set here is overridden by the matching SILO_*
# variable in /etc/silo/silo.env.
#
# A value that cannot be read keeps its default and logs a warning -- but a
# file that cannot be *parsed* at all is fatal, and the service will not start.
# `silo serve -C /etc/silo/silo.conf` against a copy is the cheap way to check.
#
# Full reference: docs/configuration.md and the README's environment table.

[fileserver]
# Bind address and port. Silo has no TLS of its own; keep it on loopback and
# put a reverse proxy in front. See docs/deployment.md.
#host = 127.0.0.1
#port = 8082

# Largest accepted upload, in megabytes. 0 is no limit.
#max_upload_size = 0

# debug, info, warn, error.
#go_log_level = info

# /debug/pprof. Setting this true without profile_password is fatal at
# startup, and the routes answer whether or not it is on -- block them at the
# proxy either way.
#enable_profiling = false
#profile_password =

[libraries]
# Whether accounts with the `user` role may create their own libraries. false
# is the curated install: only an admin makes libraries. Never applies to an
# admin, and never promotes a guest.
#allow_user_create_library = true

[history]
# Days of file history kept by default. 0 keeps everything. See docs/quota.md.
#keep_days = 0

[quota]
# A bare number means gigabytes here; write the unit to mean anything else.
# Unset means no ceiling.
#default =
#server =
# Free space held back so a full disk cannot corrupt a write.
#reserve = 1gb

[storage]
# Pack sealing, orphan collection and compaction. docs/configuration.md argues
# each of these; pack_max_age is the one that actually decides how large packs
# get on a server that is not ingesting near a gigabyte a minute.
# Sizes need their unit (512mb, 10gb) because a bare number already means
# gigabytes under [quota]. Durations are Go durations: 30s, 5m, 72h.
#pack_size = 512mb
#pack_max_age = 5m
#pack_sweep = 30s
#orphan_age = 24h
#compact_threshold = 0.5
#compact_min_age = 24h
#compact_budget = 0
#commit_attempts = 5
#library_fault_interval = 5m

[oidc]
# Sign in through an OpenID Connect identity provider, with the device flow:
# the client shows a code, the person approves at the IdP, and Silo never
# serves a page. Register Silo at the IdP as a confidential client with the
# device grant enabled. Keep the secret in silo.env as SILO_OIDC_CLIENT_SECRET
# rather than here. All three of issuer, client_id and client_secret, or none.
#issuer = https://id.example.com/application/o/silo/
#client_id = silo
# link: existing accounts, matched by verified address, and invited addresses.
# create: link, plus a new account for anyone else the IdP signs in.
# isolated: a new account per identity, never matched by address.
#accounts = link
#allowed_domains = example.com
