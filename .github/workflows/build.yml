name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tag pushes
  packages: write # needed to push container images to ghcr.io

jobs:
  # One lint/test pass up front; no point building four platforms if the
  # tree is already broken.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1: several fileserver test packages share a fixed temp data directory
        # with the same library ID, so parallel package execution races. Proper
        # fix is t.TempDir() in those tests.
        run: go test -p 1 ./...
      # A release is the one build that must not ship a known-reachable
      # advisory, whatever the weekly scan last said. See vuln.yml for the
      # scan that runs without a commit to prompt it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build silo
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/silo-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags "-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o "$out" ./cmd/silo
          # Run the binary only on matching host
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            "$out" version
          fi
          # Tarball with a stable inner filename (`silo`) so users get
          # `./silo` after `tar xf`, regardless of platform.
          tmp=$(mktemp -d)
          cp "$out" "$tmp/silo"
          tar -C "$tmp" -czf "$out.tar.gz" silo
          (cd dist && sha256sum "$(basename "$out").tar.gz" > "$(basename "$out").tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: silo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The .deb and .rpm are repackaged from the binaries `build` already made --
  # no second compile, no toolchain in the packaging path. Runs on manual
  # dispatch too, so a packaging mistake is caught before the tag rather than
  # during the release.
  packages:
    needs: build
    runs-on: ubuntu-latest
    env:
      NFPM_VERSION: v2.47.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }}

      - name: Compute version
        id: version
        run: |
          v="$(git describe --tags --always --dirty)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # nfpm wants no leading v, and neither dpkg nor rpm accepts one.
          echo "pkgversion=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: silo-linux-*
          path: artifacts
          merge-multiple: true

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.pkgversion }}
        run: |
          set -euo pipefail
          mkdir -p dist packaging/.staged
          for arch in amd64 arm64; do
            tarball="artifacts/silo-${{ steps.version.outputs.version }}-linux-${arch}.tar.gz"
            # nfpm does not expand ${...} inside contents[].src, so the binary
            # is staged at the fixed path nfpm.yaml names rather than passed in
            # as a variable. One arch at a time, overwriting the last.
            tar -xzf "$tarball" -C packaging/.staged silo
            chmod 0755 packaging/.staged/silo
            for format in deb rpm; do
              ARCH="$arch" nfpm pkg -f packaging/nfpm.yaml -p "$format" -t dist/
            done
          done
          rm -rf packaging/.staged
          (cd dist && for f in *.deb *.rpm; do sha256sum "$f" > "$f.sha256"; done)
          ls -lh dist/

      # A package that installs is the only thing that proves the maintainer
      # scripts parse and the paths are right. The container has no systemd, so
      # every systemctl call falls through the `-d /run/systemd/system` guard --
      # which is itself worth exercising.
      - name: Smoke-test the .deb
        run: |
          set -euo pipefail
          deb="$(ls dist/silo_*_amd64.deb)"
          sudo dpkg -i "$deb"
          test -x /usr/bin/silo
          test -f /usr/lib/systemd/system/silo.service
          test -f /etc/silo/silo.conf
          [ "$(stat -c '%a' /etc/silo/silo.env)" = "600" ]
          getent passwd silo >/dev/null
          silo version
          # Static analysis of the unit, with the silo user now present so
          # User=/Group= resolve. Advisory rather than gating: a future systemd
          # tightening a directive into an error would otherwise block a
          # release over a warning. Read the output when this job is touched.
          systemd-analyze verify /usr/lib/systemd/system/silo.service || true
          sudo dpkg -r silo
          # The account survives removal on purpose: /var/lib/silo may still be
          # owned by that uid. See packaging/scripts/postremove.sh.
          getent passwd silo >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: silo-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [build, packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Update the Homebrew tap from the release that just published.
  #
  # This runs from silo rather than from the tap because the checksums are
  # already here: the tap's own generate-formula.sh has to wait for the release
  # to become visible and then fetch the sidecars back over HTTP, which is a
  # race and a network round trip for data this job already has on disk.
  #
  # Needs a HOMEBREW_TAP_TOKEN secret with contents:write on dkam/homebrew-silo.
  # Without it the job reports what to run by hand and succeeds, because a
  # missing tap token must not turn a good release red.
  homebrew:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check for the tap token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Tap not updated::HOMEBREW_TAP_TOKEN is not set. Update the tap with: packaging/homebrew/generate-formula.sh ${{ github.ref_name }} -o Formula/silo.rb"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          fetch-depth: 0

      - name: Compute version
        if: steps.gate.outputs.ok == 'true'
        id: version
        # The same expression the build job used, so the asset filenames this
        # job looks for are the ones that were actually published.
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Check out the tap
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: dkam/homebrew-silo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Fetch release artifacts
        if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          # Two dashes: this is silo-<goos>-<goarch>, the four platform
          # tarballs and their sidecars. It deliberately does not match
          # silo-packages, which holds the debs and rpms this job has no use
          # for.
          pattern: silo-*-*
          path: dist
          merge-multiple: true

      - name: Regenerate the formula
        if: steps.gate.outputs.ok == 'true'
        run: |
          ./packaging/homebrew/generate-formula.sh \
            "${{ steps.version.outputs.version }}" \
            --dist dist \
            -o tap/Formula/silo.rb
          git -C tap diff --stat

      - name: Commit and push the tap
        if: steps.gate.outputs.ok == 'true'
        working-directory: tap
        run: |
          if git diff --quiet -- Formula/silo.rb; then
            echo "Formula already at ${{ steps.version.outputs.version }}; nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/silo.rb
          git commit -m "silo ${{ steps.version.outputs.version }}"
          git push

