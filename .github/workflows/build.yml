name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create releases on tag pushes
  packages: write # needed to push container images to ghcr.io

jobs:
  # One lint/test pass up front; no point building four platforms if the
  # tree is already broken.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        # -p 1: several fileserver test packages share a fixed temp data directory
        # with the same library ID, so parallel package execution races. Proper
        # fix is t.TempDir() in those tests.
        run: go test -p 1 ./...
      - name: govulncheck
        # The pinned tool dependency, not a separate install: `make vuln` runs
        # the same thing locally. This job only fires on a tag push or a manual
        # dispatch, so it is the gate on a release rather than the one on a
        # commit -- `make check` is that. See silo#74.
        run: go tool govulncheck ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - name: Build silo
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/silo-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          # The flags live in the Makefile, not here: `make build` is what a
          # developer runs to produce a deployable binary, and a release that
          # built it differently would not be testing the same thing.
          make build \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            VERSION=${{ steps.version.outputs.version }} \
            OUT="$out"
          # Run the binary only on matching host
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "amd64" ]; then
            "$out" version
          fi
          # Tarball with a stable inner filename (`silo`) so users get
          # `./silo` after `tar xf`, regardless of platform.
          tmp=$(mktemp -d)
          cp "$out" "$tmp/silo"
          tar -C "$tmp" -czf "$out.tar.gz" silo
          (cd dist && sha256sum "$(basename "$out").tar.gz" > "$(basename "$out").tar.gz.sha256")
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: silo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  docker:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
