name: govulncheck

# On every push and pull request, and once a week on a schedule.
#
# The schedule is the point. A govulncheck finding is not usually caused by a
# commit -- the code is unchanged and the advisory is new -- so a check that
# only runs when somebody pushes will report an advisory whenever the next
# push happens to be, which is how GO-2026-5970 sat in this tree until an
# audit found it rather than the build. The weekly run is what turns "the
# next audit" into "next Monday".
#
# build.yml runs the same check on the release path, where shipping a binary
# with a reachable advisory is the thing actually worth preventing.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Exits non-zero only for a vulnerability the code actually reaches, so
      # this gates on reachability rather than on the dependency list. An
      # advisory in a module we require but never call is reported and does
      # not fail the run -- x/crypto/openpgp is permanently on that list with
      # no fix, and a check that failed on it would be switched off.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
